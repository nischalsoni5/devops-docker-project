name: Docker CI/CD Pipeline

on:
  pull_request:
    types:
      - closed

jobs:
  docker:
    if: github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup QEMU
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      # Setup Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login ECR
      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build image for scanning
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: myapp:scan

      # Scan image
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:scan
          format: table
          exit-code: 0

      # Build , Push Images
      - name: Build and Push Multi-Platform Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64

          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}

            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/myapp:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/myapp:${{ github.sha }}